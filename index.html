<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>【SW2.5】耐久チェッカー Ver.2.0</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas"></script>

<style>
body {
    margin:0;
    padding:20px;
    font-family:sans-serif;
    color:#ddd;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08) 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(135deg,#0f172a,#1e293b,#020617);
}

h1 { text-align:center; }

.container {
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card {
    background:rgba(30,30,40,0.85);
    border-radius:16px;
    padding:20px;
}

.input-grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px 20px;
}

.field {
    display:flex;
    align-items:center;
    gap:10px;
}

.field span {
    min-width:120px;
}

/* キャップ選択 */
.cap-row {
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
}

.cap-row label {
    min-width:120px;
}

select {
    padding:7px 12px;
    border:1px solid #444;
    border-radius:6px;
    background:#111;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

/* ステッパー */
.stepper {
    display:flex;
    align-items:center;
    border:1px solid #444;
    border-radius:6px;
    overflow:hidden;
    background:#111;
}

.stepper input {
    width:80px;
    text-align:center;
    border:none;
    background:transparent;
    color:#fff;
    outline:none;
}

.stepper-btns {
    display:flex;
    flex-direction:column;
    width:28px;
    border-left:1px solid #333;
}

.stepper-btn {
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#222;
    color:#aaa;
    cursor:pointer;
    user-select:none;
    font-size:10px;
}

.stepper-btn:hover {
    background:#333;
    color:#fff;
}

/* スイッチ */
.switch-row {
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
}

.switch {
    width:52px;
    height:26px;
    position:relative;
}
.switch input{display:none;}

.slider {
    position:absolute;
    width:100%;
    height:100%;
    background:#555;
    border-radius:20px;
}
.slider:before {
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    left:3px;
    top:3px;
    background:white;
    border-radius:50%;
    transition:.3s;
}
input:checked + .slider {
    background:#4a90e2;
}
input:checked + .slider:before {
    transform:translateX(26px);
}

button {
    margin-top:16px;
    margin-right:8px;
    padding:8px 14px;
    background:#4a90e2;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

button:hover {
    background:#5aa0ef;
}

.chart-container { height:320px; }

.score {
    text-align:center;
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
}

.sub {
    text-align:center;
    font-size:13px;
    color:#aaa;
}

#comment {
    color:#e5e5e5;
    font-weight:600;
}

.version {
    margin-top:16px;
    text-align:right;
    font-size:11px;
    color:#777;
}

@media (max-width: 800px) {
    .container {
        grid-template-columns:1fr;
    }

    .input-grid {
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<h1>【SW2.5】耐久チェッカー Ver.2.0</h1>

<div class="container">

<!-- 入力 -->
<div class="card">

<h2>ステータス</h2>

<div class="cap-row">
    <label for="cap">キャップ</label>
    <select id="cap">
        <option value="2">2キャップ</option>
        <option value="3">3キャップ</option>
        <option value="4">4キャップ</option>
        <option value="5">5キャップ</option>
        <option value="6">6キャップ</option>
        <option value="7">7キャップ</option>
        <option value="8">8キャップ</option>
        <option value="9">9キャップ</option>
        <option value="10">10キャップ</option>
        <option value="12">12キャップ</option>
        <option value="13" selected>13キャップ</option>
    </select>
</div>

<div class="input-grid">

<div class="field">
<span>HP</span>
<div class="stepper">
<input id="hp" value="0" oninput="sanitize(this)">
<div class="stepper-btns">
<div class="stepper-btn" onclick="chg('hp',1)">▲</div>
<div class="stepper-btn" onclick="chg('hp',-1)">▼</div>
</div>
</div>
</div>

<div class="field" id="evaRow">
<span>回避力</span>
<div class="stepper">
<input id="eva" value="0" oninput="sanitize(this)">
<div class="stepper-btns">
<div class="stepper-btn" onclick="chg('eva',1)">▲</div>
<div class="stepper-btn" onclick="chg('eva',-1)">▼</div>
</div>
</div>
</div>

<div class="field">
<span>生命抵抗力</span>
<div class="stepper">
<input id="vit" value="0" oninput="sanitize(this)">
<div class="stepper-btns">
<div class="stepper-btn" onclick="chg('vit',1)">▲</div>
<div class="stepper-btn" onclick="chg('vit',-1)">▼</div>
</div>
</div>
</div>

<div class="field">
<span>精神抵抗力</span>
<div class="stepper">
<input id="mnd" value="0" oninput="sanitize(this)">
<div class="stepper-btns">
<div class="stepper-btn" onclick="chg('mnd',1)">▲</div>
<div class="stepper-btn" onclick="chg('mnd',-1)">▼</div>
</div>
</div>
</div>

<div class="field">
<span>物理D軽減</span>
<div class="stepper">
<input id="phys" value="0" oninput="sanitize(this)">
<div class="stepper-btns">
<div class="stepper-btn" onclick="chg('phys',1)">▲</div>
<div class="stepper-btn" onclick="chg('phys',-1)">▼</div>
</div>
</div>
</div>

<div class="field">
<span>魔法D軽減</span>
<div class="stepper">
<input id="magic" value="0" oninput="sanitize(this)">
<div class="stepper-btns">
<div class="stepper-btn" onclick="chg('magic',1)">▲</div>
<div class="stepper-btn" onclick="chg('magic',-1)">▼</div>
</div>
</div>
</div>

</div>

<div class="switch-row">
    <span>魔法使い・射手系</span>
    <label class="switch">
        <input type="checkbox" id="ranged" onchange="toggleEva()">
        <span class="slider"></span>
    </label>

    <span style="margin-left:18px;">限界超過</span>
    <label class="switch">
        <input type="checkbox" id="overLimit">
        <span class="slider"></span>
    </label>
</div>

<button onclick="updateChart()">更新</button>
<button onclick="resetValues()">初期値リセット</button>
<button onclick="saveImage()">結果保存（png形式）</button>

</div>

<!-- 結果 -->
<div class="card" id="chartCard" style="display:none;">
<h2 id="resultTitle">評価結果（13キャップ）</h2>

<div class="chart-container">
<canvas id="radarChart"></canvas>
</div>

<div class="score" id="totalScore"></div>
<div class="sub" id="comment"></div>
<div class="sub" id="scoreMax"></div>
<div class="version">Ver2.0 2026/08/20</div>

</div>

</div>

<script>
let chart = null;

/*
 * 各キャップの評価基準
 * min  = 0段目（これ以下は一律0点）
 * max  = 10段目
 * step = 1段階あたりの刻み値
 */
const CAP_DATA = {
    2: {
        hp:    {min:10, max:30, step:2},
        eva:   {min:4,  max:8,  step:0.4},
        vit:   {min:3,  max:7,  step:0.4},
        mnd:   {min:3,  max:7,  step:0.4},
        phys:  {min:0,  max:8,  step:0.8},
        magic: {min:0,  max:2,  step:0.2}
    },
    3: {
        hp:    {min:14, max:35, step:2.1},
        eva:   {min:5,  max:9,  step:0.4},
        vit:   {min:4,  max:8,  step:0.4},
        mnd:   {min:4,  max:8, step:0.4},
        phys:  {min:0,  max:10, step:1},
        magic: {min:0, max:4, step:0.4}
    },
    4: {
        hp:    {min:18, max:40, step:2.2},
        eva:   {min:7,  max:11, step:0.4},
        vit:   {min:5,  max:9, step:0.4},
        mnd:   {min:5,  max:9, step:0.4},
        phys:  {min:0, max:12, step:1.2},
        magic: {min:0, max:5, step:0.5}
    },
    5: {
        hp:    {min:22, max:50, step:2.8},
        eva:   {min:9,  max:14, step:0.5},
        vit:   {min:6,  max:11, step:0.5},
        mnd:   {min:6,  max:11, step:0.5},
        phys:  {min:0, max:14, step:1.4},
        magic: {min:0, max:6, step:0.6}
    },
    6: {
        hp:    {min:26, max:55, step:2.9},
        eva:   {min:11, max:16, step:0.5},
        vit:   {min:7,  max:12, step:0.5},
        mnd:   {min:7,  max:12, step:0.5},
        phys:  {min:0, max:16, step:1.6},
        magic: {min:0, max:7, step:0.7}
    },
    7: {
        hp:    {min:30, max:70, step:4},
        eva:   {min:13, max:18, step:0.5},
        vit:   {min:8, max:13, step:0.5},
        mnd:   {min:8, max:13, step:0.5},
        phys:  {min:0, max:18, step:1.8},
        magic: {min:0, max:8, step:0.8}
    },
    8: {
        hp:    {min:34, max:75, step:4.1},
        eva:   {min:15, max:21, step:0.6},
        vit:   {min:9, max:15, step:0.6},
        mnd:   {min:9, max:15, step:0.6},
        phys:  {min:0, max:20, step:2},
        magic: {min:0, max:9, step:0.9}
    },
    9: {
        hp:    {min:38, max:90, step:5.2},
        eva:   {min:17, max:23, step:0.6},
        vit:   {min:10, max:16, step:0.6},
        mnd:   {min:10, max:16, step:0.6},
        phys:  {min:0, max:22, step:2.2},
        magic: {min:0, max:10, step:1}
    },
    10: {
        hp:    {min:42, max:95, step:5.3},
        eva:   {min:19, max:25, step:0.6},
        vit:   {min:11, max:17, step:0.6},
        mnd:   {min:12, max:18, step:0.6},
        phys:  {min:0, max:24, step:2.4},
        magic: {min:0, max:8, step:0.8}
    },
    12: {
        hp:    {min:46, max:110, step:6.4},
        eva:   {min:22, max:29, step:0.7},
        vit:   {min:13, max:20, step:0.7},
        mnd:   {min:14, max:21, step:0.7},
        phys:  {min:0, max:28, step:2.8},
        magic: {min:0, max:9, step:0.9}
    },
    13: {
        hp:    {min:50, max:120, step:7},
        eva:   {min:24, max:32, step:0.8},
        vit:   {min:14, max:22, step:0.8},
        mnd:   {min:16, max:24, step:0.8},
        phys:  {min:0, max:30, step:3},
        magic: {min:0, max:10, step:1}
    }
};

/* 全角→半角＋数字以外削除 */
function sanitize(el){
    let v = el.value;
    v = v.replace(/[０-９]/g, s =>
        String.fromCharCode(s.charCodeAt(0) - 65248)
    );
    v = v.replace(/[^0-9]/g,'');
    el.value = v;
}

/* ± */
function chg(id,val){
    const el = document.getElementById(id);
    let n = parseInt(el.value || 0);
    if(isNaN(n)) n = 0;
    el.value = Math.max(0, n + val);
}

/* 回避切替 */
function toggleEva(){
    const row = document.getElementById("evaRow");
    const r = document.getElementById("ranged").checked;
    row.style.visibility = r ? "hidden" : "visible";
}

/*
 * 0段目を最低値とし、そこから10段階評価。
 *
 * value <= min       → 0点
 * value >= max       → 10点
 * それ以外           → (value - min) / step
 *
 * なお、表の刻み値をそのまま使用するため、
 * 端数は小数1桁まで丸めます。
 */
function convert(value, setting, overLimit = false){
    if(value <= setting.min) return 0;
    const score = (value - setting.min) / setting.step;
    const rounded = Math.max(0, Math.round(score * 10) / 10);

    // 通常時は10点を上限にする。
    // 「限界超過」ON時だけ、レーダー表示用の値として10点を超える。
    return overLimit ? rounded : Math.min(10, rounded);
}

/* コメント */
function getComment(t, ranged){
    const s = ranged ? 8 : 10;

    if(t < s) return "防御を極限まで抑えた構成。他分野に特化したスタイルです。";
    if(t < s * 2) return "個性重視の構成。役割特化の方向性が見えます。";
    if(t < s * 3) return "やや攻めっ気を感じる型。状況に応じた活躍が期待できます。";
    if(t < s * 4) return "バランス良好。安定した運用が可能です。";
    if(t < s * 5) return "高水準な耐久力。強敵相手でも安心感があります。";
    return "非常に高い完成度。いかなる局面においても安定した活躍が見込めます。";
}

/* チャート */
function createChart(labels,data, overLimit = false){
    chart = new Chart(document.getElementById("radarChart"),{
        type:'radar',
        data:{
            labels,
            datasets:[{
                label:"評価（10段階）",
                data,
                fill:true,
                clip:false
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,
            scales:{
                r:{
                    min:0,
                    // 常に10段目を基準の上限にする。
                    // 10点を超えた値はclip:falseにより10段目の枠を越えて描画する。
                    max:10,
                    ticks:{
                        display:false,
                        stepSize:1
                    },
                    grid:{color:"#555"},
                    pointLabels:{color:"#ddd"}
                }
            },
            plugins:{
                legend:{
                    labels:{color:"#ddd"}
                }
            }
        }
    });
}

/* 更新 */
function updateChart(){

    const cap = document.getElementById("cap").value;
    const setting = CAP_DATA[cap];
    const ranged = document.getElementById("ranged").checked;
    const overLimit = document.getElementById("overLimit").checked;

    const hp    = +document.getElementById("hp").value || 0;
    const eva   = +document.getElementById("eva").value || 0;
    const vit   = +document.getElementById("vit").value || 0;
    const mnd   = +document.getElementById("mnd").value || 0;
    const phys  = +document.getElementById("phys").value || 0;
    const magic = +document.getElementById("magic").value || 0;

    // レーダー用：限界超過ON時のみ10点を超える値を保持。
    const radarScores = {
        hp: convert(hp, setting.hp, overLimit),
        phys: convert(phys, setting.phys, overLimit),
        magic: convert(magic, setting.magic, overLimit),
        eva: convert(eva, setting.eva, overLimit),
        vit: convert(vit, setting.vit, overLimit),
        mnd: convert(mnd, setting.mnd, overLimit)
    };

    const radarData = ranged
        ? [radarScores.hp, radarScores.phys, radarScores.magic, radarScores.vit, radarScores.mnd]
        : [radarScores.hp, radarScores.phys, radarScores.magic, radarScores.eva, radarScores.vit, radarScores.mnd];

    // 総合点は常に各項目10点満点。限界超過はレーダー表示だけに反映。
    const data = radarData.map(v => Math.min(10, v));

    const labels = ranged
        ? ['HP','物理D軽減','魔法D軽減','生命抵抗力','精神抵抗力']
        : ['HP','物理D軽減','魔法D軽減','回避力','生命抵抗力','精神抵抗力'];

    const total = data.reduce((a,b) => a + b, 0);
    const maxScore = ranged ? 50 : 60;

    document.getElementById("totalScore").innerHTML =
        `総合値：${total.toFixed(1)}点`;

    document.getElementById("comment").innerHTML =
        getComment(total, ranged);

    document.getElementById("scoreMax").innerHTML =
        `※最大${maxScore}点`;

    document.getElementById("resultTitle").textContent =
        `評価結果（${cap}キャップ）`;

    document.getElementById("chartCard").style.display = "block";

    if (typeof Chart === "undefined") {
        return;
    }

    if(!chart){
        createChart(labels,radarData,overLimit);
    }else{
        chart.data.labels = labels;
        chart.data.datasets[0].data = radarData;

        // レーダーの基準上限は常に10。
        // 10点超過分はclip:falseで10段目の枠を越えて描画する。
        chart.options.scales.r.max = 10;
        chart.options.scales.r.ticks.display = false;
        chart.update();
    }
}

/* 初期値リセット */
function resetValues(){
    ["hp","eva","vit","mnd","phys","magic"].forEach(id=>{
        document.getElementById(id).value = 0;
    });

    // トグル状態はリセットせず、そのまま保持する。
    toggleEva();
}

/* 保存 */
function saveImage(){
    html2canvas(document.getElementById("chartCard"),{
        scale:2,
        backgroundColor:"#0f172a"
    }).then(canvas=>{
        const cap = document.getElementById("cap").value;
        const a = document.createElement("a");
        a.download = `耐久チェッカー_${cap}キャップ.png`;
        a.href = canvas.toDataURL("image/png");
        a.click();
    });
}

/* 初期表示 */
toggleEva();
</script>

</body>
</html>
